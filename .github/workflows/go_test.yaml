name: Go Test

on:
  push:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: './go.mod'
        cache: false

    - name: Cache Go
      uses: actions/cache@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build        
        key: "${{ runner.os }}-go-${{ hashFiles('go.sum') }}"

    - name: Run tests
      run: go test ./...
